[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qualidrive"
version = "0.1.0"
description = "Automated NVMe SSD qualification and regression framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Storage Qualification Team" }
]
dependencies = [
    "pyyaml>=6.0",
    "pytest>=7.0",
]

[project.scripts]
qualidrive = "qualidrive.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
